info:
  name: Listar_Signatarios
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/v2/signers?access_token={{token}}"
  params:
    - name: access_token
      value: "{{token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
